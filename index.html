<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>はな</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main id="app"></main>

  <script>document.write(`<script src="messages.js?v=${Date.now()}"><\/script>`)</script>
  <script>
    const app = document.getElementById("app");
    const root = document.documentElement;
    root.style.setProperty("--main", SITE.color);
    root.style.setProperty("--cover-bg", SITE.bg);
    document.title = SITE.name;

    function esc(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // 写真が未設定なら灰色の枠を出す
    function photo(src, cls, label = "写真") {
      return src
        ? `<img class="${cls}" src="${esc(src)}" alt="">`
        : `<div class="${cls} ph">${label}</div>`;
    }

    function show(html, screenClass) {
      app.className = screenClass;
      app.innerHTML = html;
      window.scrollTo(0, 0);
    }

    const envelopeHtml = `
      <div class="env">
        <div class="env-back"></div>
        <div class="env-paper"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="env-seal"></div>
      </div>`;

    /* ① 最初の画面：手紙をタップ */
    function renderCover() {
      show(`
        <section class="screen cover">
          <p class="cover-text">${esc(SITE.name)}さんに<br>メッセージが届いています</p>
          <button class="env-btn" type="button" aria-label="手紙をひらく">
            <span class="ripple" aria-hidden="true"></span>
            ${envelopeHtml}
          </button>
          <p class="tap-hint" aria-hidden="true">
            <svg class="finger" viewBox="0 0 24 24" width="28" height="28"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.7-2.3L4.4 15.6a1.5 1.5 0 0 1 2.3-1.9L9 16" fill="#f8f0e4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>手紙をタップしてね</span>
          </p>
        </section>`, "is-cover");
      app.querySelector(".env-btn").addEventListener("click", renderGame);
    }

    /* ② ミニゲーム（共通の部品） */
    function gameScreen(hud, body, tip) {
      show(`
        <section class="screen cover">
          <div class="game-card">
            <div class="game-top">
              <p class="game-head">GAME</p>
              <button class="skip-btn" type="button">スキップして手紙をひらく</button>
            </div>
            <p class="game-title">${esc(SITE.game.title)}</p>
            <p class="game-hud">${hud}</p>
            ${body}
            <p class="game-msg" aria-live="polite"></p>
            <p class="game-tip">${tip}</p>
          </div>
        </section>`, "is-cover");
      app.querySelector(".skip-btn").addEventListener("click", renderOpening);
      return app.querySelector(".game-msg");
    }
    function bump(el, n) {
      el.textContent = n;
      el.classList.remove("bump");
      void el.offsetWidth;
      el.classList.add("bump");
    }
    function say(msg, text, big = false) {
      msg.className = big ? "game-msg big" : "game-msg";
      msg.textContent = text;
    }
    function clearGame(msg, text = "CLEAR!") {
      say(msg, text, true);
      // スキップで先に進んでいたら、二重にひらかない
      setTimeout(() => { if (msg.isConnected) renderOpening(); }, 1500);
    }
    function shake(el) {
      el.classList.remove("g-miss");
      void el.offsetWidth;
      el.classList.add("g-miss");
    }
    const rand = (n) => Math.floor(Math.random() * n);
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    // キャンバスは 300×420 の座標で描く（くっきり見えるよう2倍の解像度）
    function canvas2x(cv) {
      const ctx = cv.getContext("2d");
      ctx.scale(2, 2);
      return ctx;
    }
    function pointerX(cv, e) {
      const r = cv.getBoundingClientRect();
      return (e.clientX - r.left) * (300 / r.width);
    }
    // 画面が切りかわるまで毎フレーム step(秒) を呼ぶ
    function loop(cv, step) {
      let last = performance.now();
      function frame(t) {
        if (!cv.isConnected) return;
        const dt = Math.min((t - last) / 1000, 0.033);
        last = t;
        step(dt);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
    // 短い効果音
    let audio;
    function beep(freq, ms = 120) {
      if (!app.querySelector(".game-card")) return; // ゲーム画面を出たら鳴らさない
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const o = audio.createOscillator(), v = audio.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        v.gain.setValueAtTime(0.15, audio.currentTime);
        v.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + ms / 1000);
        o.connect(v).connect(audio.destination);
        o.start();
        o.stop(audio.currentTime + ms / 1000);
      } catch (e) {}
    }

    /* ② ミニゲーム：光の順番おぼえ */
    function renderGame() {
      const g = SITE.game;
      const tones = [330, 392, 494, 587];
      const pads = g.colors.map((c, i) =>
        `<button class="pad" type="button" data-i="${i}" style="--c:${c}" aria-label="ボタン${i + 1}"></button>`).join("");
      const msg = gameScreen(
        `<span>おぼえた数 <b class="cnt">0</b> / ${g.goal}</span>`,
        `<div class="pads">${pads}</div><button class="g-btn" type="button">スタート</button>`,
        "光った順番に、同じボタンを押してね");
      const btns = [...app.querySelectorAll(".pad")];
      const cnt = app.querySelector(".cnt");
      const startBtn = app.querySelector(".g-btn");
      let seq = [], pos = 0, state = "ready";

      function light(i) {
        btns[i].classList.add("lit");
        beep(tones[i], 300);
        setTimeout(() => btns[i].classList.remove("lit"), 380);
      }
      async function play() {
        if (!startBtn.isConnected) return;
        state = "show";
        say(msg, "よく見てね");
        await wait(600);
        for (const i of seq) { light(i); await wait(620); }
        state = "input";
        pos = 0;
        say(msg, "どうぞ！");
      }
      btns.forEach((b, i) => b.addEventListener("click", () => {
        if (state !== "input") return;
        light(i);
        if (i !== seq[pos]) {
          state = "wait";
          shake(b);
          say(msg, "おしい！もう一回見せるね");
          setTimeout(play, 1100);
          return;
        }
        pos++;
        if (pos < seq.length) return;
        bump(cnt, seq.length);
        if (seq.length >= g.goal) { state = "clear"; clearGame(msg); return; }
        state = "wait";
        say(msg, "せいかい！");
        seq.push(rand(btns.length));
        setTimeout(play, 800);
      }));
      startBtn.addEventListener("click", () => {
        startBtn.hidden = true;
        seq = [rand(btns.length)];
        play();
      });
    }

    /* ③ 手紙がひらくアニメーション */
    function renderOpening() {
      show(`<section class="screen cover"><div class="opening">${envelopeHtml}</div></section>`, "is-cover");
      requestAnimationFrame(() => requestAnimationFrame(() =>
        app.querySelector(".opening").classList.add("open")));
      setTimeout(renderLetter, 1900);
    }

    /* ④ 手紙 */
    function renderLetter() {
      const l = SITE.letter;
      show(`
        <section class="screen cover">
          <article class="paper">
            <p class="paper-to">${esc(l.to)}</p>
            <div class="paper-body">${esc(l.body)}</div>
            <p class="paper-from">${esc(l.from)}</p>
            <button class="know-btn" type="button">${esc(SITE.team)}の${esc(SITE.name)}を知る</button>
          </article>
        </section>`, "is-cover");
      app.querySelector(".know-btn").addEventListener("click", renderWorks);
    }

    /* ⑤ 担当・制作物 */
    function renderWorks() {
      const w = SITE.works;
      const cards = w.items.map((item) => {
        const inner = `${photo(item.image, "work-image", "スクリーンショット")}
          <span class="work-title">${esc(item.title)}</span>`;
        if (item.link === "profile") {
          return `<button class="work" type="button" data-profile>${inner}</button>`;
        }
        if (item.link) {
          return `<a class="work" href="${esc(item.link)}" target="_blank" rel="noopener">${inner}</a>`;
        }
        return `<div class="work">${inner}</div>`;
      }).join("");

      show(`
        <section class="works">
          <button class="back-btn" type="button">← 手紙にもどる</button>
          <div class="works-inner">
            <h2 class="works-label">担当</h2>
            <p class="works-role">${esc(w.role)}</p>
            <h2 class="works-label">制作物</h2>
            <div class="work-list">${cards}</div>
          </div>
        </section>`, "is-cover");
      app.querySelector(".back-btn").addEventListener("click", renderLetter);
      app.querySelector("[data-profile]")?.addEventListener("click", renderProfile);
    }

    /* ⑥ プロフィール */
    function renderProfile() {
      const p = SITE.profile;
      const rows = p.items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
      const qa = SITE.qa.map((x, i) => `
        <li class="qa-item ${i % 2 ? "rev" : ""}">
          <p class="qa-q">${esc(x.q)}</p>
          <p class="qa-a">${esc(x.a)}</p>
        </li>`).join("");
      const album = SITE.album.map((src) => photo(src, "album-photo")).join("");

      show(`
        <header class="top-bar">
          <nav>
            <a href="#profile">profile</a>
            <a href="#qa">Q&amp;A</a>
            <a href="#album">album</a>
          </nav>
          <span class="logo">${esc(SITE.logo)}</span>
        </header>

        ${photo(p.photo, "hero", "メイン写真")}

        <section id="profile" class="sec dark">
          <h2 class="sec-title">profile</h2>
          <dl class="profile-table">${rows}</dl>
        </section>

        <section id="qa" class="sec gray">
          <h2 class="sec-title tag">Q&amp;A</h2>
          <ul class="qa-list">${qa}</ul>
        </section>

        <section id="album" class="sec light">
          <h2 class="sec-title">album</h2>
          <div class="album">${album}</div>
        </section>

        <footer class="foot">
          <span>${esc(SITE.logo)}</span>
          <a href="#" class="to-top" aria-label="ページの上へ">▲<br>Top</a>
        </footer>`, "is-profile");

      app.querySelector(".to-top").addEventListener("click", (e) => {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    renderCover();
  </script>
</body>
</html>
